services:
  wings:
    image: ${WINGS_IMAGE:-ghcr.io/pelican/wings:latest}
    restart: unless-stopped
    cpus: ${WINGS_CPUS:-0}
    mem_limit: ${WINGS_MEM:-0}
    environment:
      - TZ=Etc/UTC
      - WINGS_UID=988
      - WINGS_GID=988
      - WINGS_USERNAME=${WINGS_USERNAME:-pelican}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${WINGS_WORKDIR}/etc:/etc/pelican"
      - "${WINGS_LIBDIR}:/var/lib/pelican"
      - "${WINGS_WORKDIR}/log:/var/log/pelican"
      - "${WINGS_TMPDIR}:/tmp/pelican"
    ports:
      - "${WINGS_PORT:-8080}:8080"
      - "${WINGS_SFTP_PORT:-2022}:2022"
